[project]
name = "brujula-ges"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karla Kauffmann", email = "k.kauffmann.f@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
brujula-ges = "brujula_ges:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]