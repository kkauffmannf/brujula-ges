[project]
name = "brujula-ges"
version = "0.1.0"
description = "Asistente que explica las Garantías Explícitas en Salud citando la norma oficial"
readme = "README.md"
authors = [
    { name = "Karla Kauffmann", email = "k.kauffmann.f@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "openai>=3.42.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
brujula-ges = "brujula_ges:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
